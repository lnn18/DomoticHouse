[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    arduino-libraries/Servo@^1.2.2

; Reloj SPI del RC522 bajado de 4MHz (default de la libreria MFRC522, ver MFRC522_SPICLOCK
; en MFRC522.h) a 400kHz: mas margen de tolerancia a ruido en jumpers dupont sueltos, sin
; ninguna desventaja practica para este uso (leer una tarjeta al abrir la puerta no exige
; velocidad maxima). Se detecto durante el diagnostico de un modulo RC522 que luego resulto
; danado (reemplazado); 400kHz se mantiene igual como margen de seguridad para el cableado
; real del proyecto, no solo como prueba temporal.
;
; Un #define local en un .cpp NO alcanza para esto: MFRC522.cpp (dentro de la libreria) es
; una unidad de compilacion separada que no ve un #define puesto en otro archivo. build_flags
; si aplica a TODAS las unidades de compilacion del proyecto, incluidas las de lib_deps.
build_flags =
    -D MFRC522_SPICLOCK=400000u
